<section class="panel metric-panel" aria-labelledby="metricTitle">
          <header class="panel-heading"><h2 id="metricTitle"><i data-icon="droplets"></i>生产指标</h2><div class="segments compact" id="metricPeriod" aria-label="指标周期"><button class="active" data-period="today" aria-pressed="true">今日</button><button data-period="month" aria-pressed="false">本月</button></div></header>
          <div class="metric-grid">
            <article class="metric-card"><div class="metric-icon" data-icon="droplet"></div><div class="metric-copy"><p id="supplyLabel">演示日供水量</p><div class="number"><strong id="supplyValue">62,480</strong><small>m³</small></div><div class="metric-change"><span>↑ 0.7%</span><em>较上期</em></div></div></article>
            <article class="metric-card"><div class="metric-icon" data-icon="energy"></div><div class="metric-copy"><p id="energyLabel">演示日用电量</p><div class="number"><strong id="energyValue">18,119.2</strong><small>kWh</small></div><div class="metric-change"><span>↑ 0.7%</span><em>较上期</em></div></div></article>
            <article class="metric-card"><div class="metric-icon" data-icon="waves"></div><div class="metric-copy"><p>出厂水浊度</p><div class="number"><strong>0.16</strong><small>NTU</small></div><div class="metric-change"><span class="muted">模拟监测值</span></div></div></article>
            <article class="metric-card"><div class="metric-icon" data-icon="leaf"></div><div class="metric-copy"><p>单位供水能耗</p><div class="number"><strong id="intensityValue">0.290</strong><small>kWh/m³</small></div><div class="metric-change"><span>↓ 2.3%</span><em>较上期</em></div></div></article>
          </div>
        </section>
